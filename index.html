<body class="bg-[#f6f9f8] text-[#0d1b2a] antialiased selection:bg-teal-900 selection:text-emerald-300">

  <!-- Slim Top-of-Page Progress Bar (Deep Vision Blue -> Clarity Teal Gradient) -->

  <!-- Branded Initial-Load Sequence Shell (Aperture Iris Motif) -->
  <div id="aperture-initial-loader">
    <div class="relative flex flex-col items-center gap-4">
      <svg class="w-20 h-20 text-emerald-400 aperture-iris-circle" viewBox="0 0 100 100" fill="none" stroke="currentColor">
        <!-- Aperture Iris Outer Ring -->
        <circle cx="50" cy="50" r="44" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
        <!-- Center Pupil/Iris Blades -->
        <circle cx="50" cy="50" r="16" class="fill-emerald-400/20 aperture-iris-blade" stroke-width="2"/>
        <path d="M50 6 A44 44 0 0 1 94 50 L50 50 Z" class="fill-teal-600/30 opacity-40"/>
        <path d="M50 94 A44 44 0 0 1 6 50 L50 50 Z" class="fill-emerald-500/30 opacity-40"/>
      </svg>
      <div class="text-center space-y-1">
        <div class="font-extrabold text-sm tracking-widest text-emerald-300 font-heading uppercase">Anugraha Eye Hospital</div>
        <div class="text-[10px] tracking-wider text-teal-400/80 font-semibold uppercase">Authentic. Affectionate. Affordable.</div>
      </div>
    </div>
  </div>

  <!-- Header Shell -->

  <main id="app" class="min-h-screen"></main>

  <!-- Footer Shell -->
